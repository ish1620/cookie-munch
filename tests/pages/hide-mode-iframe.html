<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hide-only mode: consent dialog in an iframe</title>
<meta name="expect" content="">
<meta name="mode" content="hide">
<meta name="expect-hidden" content="yes">
<link rel="stylesheet" href="style.css">
<script src="../harness.js"></script>
</head>
<body>
<h1>Hide-only mode: consent dialog in an iframe</h1>
<p data-keep>Expect: no clicks. The pop-up holding a Sourcepoint-style consent iframe is hidden,
and the page can scroll again.</p>
<div style="height:3000px">Tall page content…</div>
<div id="sp_message_container_99" data-banner style="position:fixed;inset:auto 16px 16px 16px">
  <iframe id="sp_message_iframe_99" src="iframe-inner.html?mode=hide" title="SP Consent Message"
          style="width:100%;height:200px;border:1px solid #ccc;background:#fff"></iframe>
</div>
<iframe data-keep src="about:blank" title="A normal embed, like a youtube-nocookie.com video" style="width:300px;height:80px"></iframe>
<style>
  /* The way Sourcepoint freezes the page (copied from a real site's stylesheet). */
  .sp-message-open { height: 100vh !important; width: 100vw !important; }
  .sp-message-open body { overflow: hidden !important; position: fixed !important; top: 0 !important; left: 0 !important; right: 0 !important; }
</style>
<script>document.documentElement.classList.add('sp-message-open');</script>
<script src="../../extension/content.js"></script>
</body>
</html>

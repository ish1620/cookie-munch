<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings with on/off radio pairs already off</title>
<meta name="expect" content="settings,save">
<meta name="expect-hidden" content="yes">
<meta name="expect-report" content="saved with optional cookies off">
<link rel="stylesheet" href="style.css">
<script src="../harness.js"></script>
</head>
<body>
<h1>Settings with on/off radio pairs already off</h1>
<p>Expect: opens "Manage preferences", clicks neither radio pair because both already have "off" chosen,
and clicks "Save my choices".</p>
<div class="fixed" data-banner>
  <p>We use cookies to give you the best experience on our site.</p>
  <button data-test="accept" data-close>Accept all</button>
  <button data-test="settings" data-open="panel">Manage preferences</button>
</div>
<div id="panel" class="fixed" role="dialog" aria-modal="true" data-banner hidden>
  <h2>Cookie preferences</h2>
  <form>
    <div>Analytics
      <label><input type="radio" name="analytics" value="on" data-test="analytics-on"> On</label>
      <label><input type="radio" name="analytics" value="off" checked data-test="analytics-off"> Off</label>
    </div>
  </form>
  <div role="radiogroup">Marketing
    <div role="radio" value="on" aria-checked="false" tabindex="0" data-test="marketing-on">On</div>
    <div role="radio" value="off" aria-checked="true" tabindex="0" data-test="marketing-off">Off</div>
  </div>
  <button data-test="accept" data-close>Accept all</button>
  <button data-test="save" data-close>Save my choices</button>
</div>
<script src="../../extension/content.js"></script>
</body>
</html>

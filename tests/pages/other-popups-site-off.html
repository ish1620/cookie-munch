<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Other popups on, site switched off</title>
<meta name="expect" content="">
<meta name="expect-report" content="">
<meta name="hide-other-popups" content="yes">
<meta name="disabled-sites" content="127.0.0.1">
<meta name="other-popups-host" content="fodors.com">
<link rel="stylesheet" href="style.css">
<script src="../harness.js"></script>
</head>
<body>
<h1>Other popups on, site switched off</h1>
<p>Expect: no clicks, and both boxes stay: the site is switched off in the popup, so nothing is added.</p>
<div id="newsletter-popup" class="fixed" style="bottom: 200px" data-keep>
  <p>Get the week's best stories in your inbox.</p>
  <input type="email" placeholder="Email"> <button data-test="subscribe" data-close>Subscribe</button>
  <button data-test="close" data-close>Close</button>
</div>
<div id="onesignal-slidedown-container" class="fixed" style="top: 16px; bottom: auto" data-keep>
  <p>We'd like to show you notifications for the latest news.</p>
  <button data-test="allow" data-close>Allow</button>
  <button data-test="later" data-close>Later</button>
</div>
<script src="../../extension/content.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iframe removed 100 ms after reject</title>
<meta name="expect" content="reject">
<meta name="expect-hidden" content="yes">
<meta name="expect-report" content="rejected">
<link rel="stylesheet" href="style.css">
<script src="../harness.js"></script>
</head>
<body>
<h1>Iframe removed 100 ms after reject</h1>
<p>Expect: clicks "Reject All" in the iframe; the page removes the iframe 100 ms later, and "rejected" is reported.</p>
<iframe src="iframe-action-inner.html?action=remove-delay" title="consent"
        style="position:fixed;bottom:16px;left:16px;width:520px;height:200px;border:1px solid #ccc;background:#fff"></iframe>
<script>
window.addEventListener('message', (event) => {
  if (event.data === 'remove-delay') setTimeout(() => document.querySelector('iframe')?.remove(), 100);
});
</script>
<script src="../../extension/content.js"></script>
</body>
</html>

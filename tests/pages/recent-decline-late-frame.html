<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Recent decline on the same site: a consent frame added 12 s in</title>
<meta name="last-decline-age" content="2000">
<meta name="expect" content="">
<meta name="expect-hidden" content="yes">
<meta name="expect-report" content="hidden">
<link rel="stylesheet" href="style.css">
<script src="../harness.js"></script>
</head>
<body>
<h1>Recent decline on the same site: a consent frame added 12 s in</h1>
<p>Expect: storage holds a 2 s old decline record for this page's site. The consent frame is added 12
seconds later, past the 10 s: it follows its page, so nothing in it is clicked and the page hides it.</p>
<script>
  setTimeout(() => {
    document.body.insertAdjacentHTML('beforeend', `
<div id="sp_message_container_99" data-banner style="position:fixed;inset:auto 16px 16px 16px">
  <iframe id="sp_message_iframe_99" src="iframe-inner.html" title="SP Consent Message"
          style="width:100%;height:200px;border:1px solid #ccc;background:#fff"></iframe>
</div>`);
  }, 12000);
</script>
<script src="../../extension/content.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hide-only mode: known platform</title>
<meta name="expect" content="">
<meta name="mode" content="hide">
<meta name="expect-hidden" content="yes">
<link rel="stylesheet" href="style.css">
<script src="../harness.js"></script>
</head>
<body>
<h1>Hide-only mode: known platform</h1>
<p data-keep>Expect: no clicks at all (not even Reject). The banner is hidden right away.</p>
<div id="onetrust-consent-sdk"><div id="onetrust-banner-sdk" class="fixed" data-banner>
  <p>We use cookies to improve your experience and for marketing.</p>
  <button id="onetrust-reject-all-handler" data-test="reject" data-close>Reject All</button>
  <button id="onetrust-accept-btn-handler" data-test="accept" data-close>Accept All Cookies</button>
</div></div>
<script src="../../extension/content.js"></script>
</body>
</html>
